# Skill cards, rendered by `order` (Astro stores entries sorted by id).
# Each card lists one or more chip groups; a group may have a `tier` label and `strong` chips.
# A lone last card spans the whole row.
- id: languages
  order: 1
  title:
    en: Languages
    it: Linguaggi
  groups:
    - tier:
        en: Proficient
        it: Esperto
      strong: true
      items: [C, C++, JavaScript, Python]
    - tier:
        en: Competent
        it: Competente
      items: [C#, Java, Bash, HTML, CSS, LaTeX, Markdown]

- id: embedded
  order: 2
  title:
    en: Embedded & IoT
    it: Embedded e IoT
  groups:
    - items:
        - Arduino
        - Raspberry Pi
        - ESP32
        - ESP-IDF
        - MicroPython
        - FreeRTOS
        - ROS
        - en: Yocto (basics)
          it: Yocto (basi)
        - Linux kernel
  desc:
    en: Sensors and actuators, wired and wireless communication, custom board firmware.
    it: Sensori e attuatori, comunicazione cablata e wireless, firmware per schede custom.

- id: apps
  order: 3
  title:
    en: Apps & frameworks
    it: Applicazioni e framework
  groups:
    - items: [Qt, PySide, Avalonia, React, Node.js, Electron, OpenLayers, Docker, Unix/Linux]

- id: networks
