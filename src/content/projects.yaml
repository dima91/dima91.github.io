# Projects, rendered by `order` (Astro stores entries sorted by id).
# `art` picks the banner illustration (src/components/project-art/).
# `link` must point to GitHub or GitLab: the link label is derived from it.
# `images` (optional) lists photos kept in src/assets/projects/: the first one replaces the illustration.
#   images:
#     - src: ../assets/projects/<id>/<file>.png   # relative to this file
#       alt: <text>                               # or { en, it }
- id: pi-touch-date
  order: 1
  name: pi-touch-date
  tag: Open source · MIT
  description:
    en: A touch-friendly digital calendar for Raspberry Pi with a touchscreen. It runs full-screen on Raspberry Pi OS and includes a custom on-screen keyboard control.
    it: Un calendario digitale touch per Raspberry Pi con touchscreen. Gira a schermo intero su Raspberry Pi OS e include un controllo di tastiera su schermo personalizzato.
  tech: [C#, .NET 8, Avalonia UI, ReactiveUI, Raspberry Pi, GitHub Actions]
  link: https://github.com/dima91/pi-touch-date
  art: calendar
  images:
    - src: ../assets/projects/pi_touch_date/pi_touch_date-main.png
      alt:
        en: Main screen with the day and date in large type and, below, the time, the current weather and the night mode and settings buttons
        it: Schermata principale con giorno e data a grandi caratteri e, sotto, l'ora, il meteo attuale e i pulsanti per modalità notte e impostazioni
    - src: ../assets/projects/pi_touch_date/pi_touch_date-weather.png
      alt:
        en: Weather panel with the current conditions in Siena, the day's high and low, and the forecast for night, morning, afternoon and evening
        it: Pannello meteo con le condizioni attuali a Siena, massima e minima del giorno e le previsioni per notte, mattina, pomeriggio e sera
    - src: ../assets/projects/pi_touch_date/pi_touch_date-settings.png
      alt:
        en: Settings panel with the screen brightness, the automatic night mode between sunset and sunrise, and the restart and shut down buttons
        it: Pannello impostazioni con la luminosità dello schermo, la modalità notte automatica tra tramonto e alba e i pulsanti per riavviare e arrestare

- id: my-favourite-wedding
  order: 2
  name: my-favourite-wedding
  tag:
    en: Web platform
    it: Piattaforma web
  description:
    en: "A web platform to organize a wedding: guest access with printed invitation codes, expense tracking with receipts, and photo uploads from guests, stored on self-hosted S3-compatible storage."
    it: "Una piattaforma web per organizzare un matrimonio: accesso degli invitati con codici stampati sugli inviti, gestione delle spese con ricevute e caricamento delle foto da parte degli ospiti, su storage S3-compatibile self-hosted."
  tech: [React, Mantine, Express.js, PostgreSQL, Docker Compose, Garage / MinIO]
  link: https://gitlab.com/dima.91/my-favourite-wedding
  art: wedding

